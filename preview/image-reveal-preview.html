<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>画像登場プレビュー</title>
<style>
  :root { --bg:#f3f8f6; --text:#244038; --primary:#349687; --primary-dark:#2a7a6e; --H:420px; --R:52px; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Mulish","Hiragino Maru Gothic ProN","Zen Maru Gothic",system-ui,sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 40px 16px;
  }
  h1 { font-size: 1.15rem; font-weight: 800; margin: 0; }
  .caption { font-size: .85rem; color: #5d7a72; margin: 0; text-align: center; }

  /* ===== ビジョンボード：フリップで登場（フリップ残し） ===== */
  .stage { position: relative; width: min(320px, 82vw); perspective: 1100px; }
  .vision-reveal {
    display: block; width: 100%; border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    transform-origin: center center;
    animation: flipReveal 4s cubic-bezier(0.2,0.7,0.2,1) infinite;
  }
  @keyframes flipReveal {
    0%   { opacity: 0; transform: rotateY(0deg)   scale(.86); filter: brightness(.55) saturate(.7); }
    14%  { opacity: 1; }
    34%  { opacity: 1; transform: rotateY(360deg) scale(1);   filter: brightness(.6) saturate(.8); }
    60%  { filter: brightness(.68) saturate(.85); }
    82%  { opacity: 1; transform: rotateY(360deg) scale(1);   filter: brightness(1) saturate(1); }
    92%  { opacity: 1; filter: brightness(1) saturate(1); }
    100% { opacity: 0; transform: rotateY(360deg) scale(.95); filter: brightness(1.15) saturate(1); }
  }

  /* ===== 螺旋パーティクル（下から上昇→上で消滅） ===== */
  .swirl { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; pointer-events: none; z-index: 2; }
  .pos { position: absolute; left: 50%; }
  .dot {
    display: block; border-radius: 50%; background: #fff; opacity: 0;
    box-shadow: 0 0 4px #fff, 0 0 9px #fff, 0 0 16px rgba(170,214,255,.9);
    transform: translateY(10px) scale(0);
    animation: pop 4s ease-out infinite;
  }
  .dot.big { box-shadow: 0 0 6px #fff, 0 0 14px #fff, 0 0 24px #bfe0ff; }
  @keyframes pop {
    0%   { opacity: 0;          transform: translateY(10px) scale(0); }
    6%   { opacity: var(--b);   transform: translateY(0)    scale(1); }
    16%  { opacity: var(--b);   transform: translateY(-4px) scale(1); }
    30%  { opacity: 0;          transform: translateY(-18px) scale(.35); }
    100% { opacity: 0; }
  }

  /* 光の出どころ（上まで上がって消える） */
  .head {
    position: absolute; left: 50%; bottom: 0; width: 12px; height: 12px; margin-left: -6px;
    border-radius: 50%; z-index: 3; opacity: 0;
    background: radial-gradient(circle, #fff 0%, #eaf4ff 45%, rgba(190,224,255,0) 72%);
    filter: drop-shadow(0 0 7px #fff) drop-shadow(0 0 14px #bfe0ff);
    animation: headRise 4s ease-in-out infinite;
  }
  @keyframes headRise {
    0%   { opacity: 0; transform: translate(0, 0) scale(.5); }
    6%   { opacity: 1; }
    20%  { transform: translate(calc(var(--R) * .6),  calc(var(--H) * -.20)) scale(1); }
    40%  { transform: translate(calc(var(--R) * -.55), calc(var(--H) * -.42)) scale(1); }
    58%  { transform: translate(calc(var(--R) * .5),  calc(var(--H) * -.62)) scale(1); }
    70%  { opacity: 1; transform: translate(0, calc(var(--H) * -.80)) scale(.95); }
    78%  { opacity: 0; transform: translate(0, calc(var(--H) * -.92)) scale(.3); }
    100% { opacity: 0; }
  }

  button {
    border: none; border-radius: 999px; padding: 11px 26px; font-size: .95rem;
    font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    box-shadow: 0 6px 16px rgba(52,150,135,0.25);
  }
</style>
</head>
<body>
  <h1>画像の登場演出プレビュー（螺旋パーティクル上昇）</h1>

  <div class="stage">
    <img class="vision-reveal" alt="sample vision board" src="https://picsum.photos/seed/ikigai/600/800" />
    <div class="swirl"></div>
    <span class="head"></span>
  </div>

  <p class="caption">下から螺旋でパーティクルが立ちのぼり、光の出どころが上で消える／ビジョンボードはフリップで登場／数秒ごとに自動ループ</p>
  <button type="button" onclick="replay()">もう一度再生</button>

  <script>
    var stage = document.querySelector('.stage');
    var swirl = document.querySelector('.swirl');

    function build() {
      var w = stage.clientWidth || 300;
      var H = Math.round(w * 4 / 3) - 24;   // 画像の高さ相当（3:4）
      var R = Math.round(w * 0.19);          // 螺旋の半径
      document.documentElement.style.setProperty('--H', H + 'px');
      document.documentElement.style.setProperty('--R', R + 'px');

      var N = 42, turns = 3.2, sweep = 1.25; // 粒数 / 回転数 / 下→上の活性化にかける秒
      swirl.innerHTML = '';
      for (var i = 0; i < N; i++) {
        var t = i / (N - 1);
        var y = t * H;                              // 下(0)から上(H)へ
        var ang = t * turns * Math.PI * 2;
        var x = R * Math.sin(ang);
        var depth = (Math.cos(ang) + 1) / 2;        // 0:奥 1:手前
        var size = (2.4 + depth * 4).toFixed(1);
        var b = (0.5 + depth * 0.5).toFixed(2);
        var delay = (t * sweep).toFixed(3);

        var pos = document.createElement('span');
        pos.className = 'pos';
        pos.style.bottom = y + 'px';
        pos.style.marginLeft = x.toFixed(1) + 'px';

        var dot = document.createElement('span');
        dot.className = 'dot' + (depth > 0.62 ? ' big' : '');
        dot.style.width = dot.style.height = size + 'px';
        dot.style.setProperty('--b', b);
        dot.style.animationDelay = delay + 's';

        pos.appendChild(dot);
        swirl.appendChild(pos);
      }
    }

    function replay() {
      document.querySelectorAll('.vision-reveal, .dot, .head').forEach(function (el) {
        el.style.animationName = 'none'; void el.offsetWidth; el.style.animationName = '';
      });
    }

    var img = document.querySelector('.vision-reveal');
    if (img.complete) build(); else img.addEventListener('load', build);
    build();
    window.addEventListener('resize', build);
  </script>
</body>
</html>
