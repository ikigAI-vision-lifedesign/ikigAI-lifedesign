<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>導入ページ案（直感版）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
 :root{--bg:#f3f8f6;--surface:#fff;--text:#223b35;--sub:#5d7a72;--teal:#2a7a6e;--teal2:#38aa96;--pink:#e85d78;--border:#dfe9e5;
   --head:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;--body:"Mulish","Hiragino Maru Gothic ProN",sans-serif}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.7}
 .wrap{position:relative;max-width:980px;margin:0 auto;padding:30px 20px 52px}
 .logo{display:block;height:62px;width:auto;max-width:82%;margin:0 auto 26px}
 .hero{display:flex;flex-direction:column;align-items:center;gap:26px}
 .hero-copy{text-align:center;max-width:580px}
 .concept{color:var(--teal);font-weight:800;font-size:.92rem;letter-spacing:.02em;margin:0 0 14px}
 .concept .hl{color:var(--pink)}
 h1{font-family:var(--head);font-weight:900;font-size:1.5rem;line-height:1.72;margin:0 0 16px}
 h1 .mark{color:var(--pink)}
 h1 ruby{ruby-position:over}
 h1 rt{font-size:.34em;color:var(--text);font-weight:800;letter-spacing:-.03em;margin-bottom:.12em}
 .lead{color:var(--sub);font-weight:700;margin:0 0 22px}
 .pcbr{display:none}
 .cta{display:inline-flex;align-items:center;gap:10px;padding:16px 36px;border-radius:999px;border:none;
   background:linear-gradient(135deg,var(--teal) 0%,var(--teal2) 55%,#6eb6e8 100%);color:#fff;font-family:inherit;
   font-weight:900;font-size:1.12rem;cursor:pointer;box-shadow:0 10px 24px rgba(42,122,110,.28);text-decoration:none}
 .scene{perspective:1400px;width:min(300px,74vw)}
 .card{position:relative;width:100%;aspect-ratio:440/788;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.45,.05,.2,1)}
 .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.17)}
 .face img{width:100%;height:100%;object-fit:cover;display:block}
 .back{transform:rotateY(180deg)}
 .board-cap{text-align:center;color:var(--sub);font-size:.82rem;font-weight:700;margin-top:12px}
 .value{margin-top:46px;text-align:center}
 .value h2{font-family:var(--head);font-weight:700;font-size:1.12rem;margin:0 0 18px}
 .chips{display:grid;grid-template-columns:1fr;gap:12px;max-width:520px;margin:0 auto}
 .chip{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;text-align:left;font-weight:700}
 .chip .ic{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
 .chip b{font-weight:900}
 @media(min-width:760px){
   .logo{height:72px}
   .hero{flex-direction:row-reverse;justify-content:center;gap:48px;align-items:center}
   .hero-copy{text-align:left}
   h1{font-size:2.1rem}
   .pcbr{display:inline}
   .chips{grid-template-columns:repeat(3,1fr);max-width:none}
 }
 .fade{opacity:0;transform:translateY(10px);animation:fade .7s ease forwards}
 @keyframes fade{to{opacity:1;transform:none}}
</style></head>
